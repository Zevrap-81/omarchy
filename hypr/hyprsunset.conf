# Warm tint applied all day to reduce eye strain / headaches.
# Toggle off anytime with: omarchy toggle nightlight
profile {
    time = 00:00
    temperature = 4500
}

# To enable auto switch to nightlight, set in your .config/hypr/autostart:
# exec-once = uwsm app -- hyprsunset
# and use the following:
# profile {
#     time = 20:00
#     temperature = 4000
# }
