# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # Minimal gaps with a thin, visible border
    gaps_in = 1
    gaps_out = 1
    border_size = 1

    # Use master layout instead of dwindle
    layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 10
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Let a single window use the full desktop width (0 0 disables the aspect cap)
    single_window_aspect_ratio = 0 0
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # A shared window occupies most of the screen (wider single column)
    column_width = 0.6
}
