# Lid detection is opt-in; without it every `lid_state` condition in
# config.toml fails and hyprdynamicmonitors logs "No matching profile found".
#
# Power events are switched off to match the old hyprland.conf exec-once line
# (`--enable-lid-events true --disable-power-events true`). No profile in
# config.toml uses a `power_state` condition, so listening would only cause
# needless reloads when AC is plugged or unplugged.
[Service]
ExecStart=
ExecStart=/usr/bin/hyprdynamicmonitors run --enable-lid-events --disable-power-events
